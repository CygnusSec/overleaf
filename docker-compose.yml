services:
  sharelatex:
    image: ${SHARELATEX_IMAGE}
    container_name: ${SHARELATEX_CONTAINER_NAME}
    restart: ${SHARELATEX_RESTART_POLICY}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${OVERLEAF_HTTP_PORT}:80"
    stop_grace_period: ${SHARELATEX_STOP_GRACE_PERIOD}
    volumes:
      - ${SHARELATEX_DATA_PATH}:/var/lib/overleaf
      - ${BACKUP_DATA_PATH}:/var/lib/overleaf/backups
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      TZ: ${TZ}
      DEBUG_NODE: "${DEBUG_NODE}"
      OVERLEAF_APP_NAME: ${OVERLEAF_APP_NAME}
      OVERLEAF_MONGO_URL: ${OVERLEAF_MONGO_URL}
      OVERLEAF_REDIS_HOST: ${OVERLEAF_REDIS_HOST}
      REDIS_HOST: ${REDIS_HOST}
      ENABLED_LINKED_FILE_TYPES: ${ENABLED_LINKED_FILE_TYPES}
      ENABLE_CONVERSIONS: "${ENABLE_CONVERSIONS}"
      ENABLE_PANDOC_CONVERSIONS: "${ENABLE_PANDOC_CONVERSIONS}"
      LOCAL_PANDOC_CONVERSIONS: "${LOCAL_PANDOC_CONVERSIONS}"
      EMAIL_CONFIRMATION_DISABLED: "${EMAIL_CONFIRMATION_DISABLED}"
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      OVERLEAF_SITE_URL: ${OVERLEAF_SITE_URL}
      OVERLEAF_NAV_TITLE: ${OVERLEAF_NAV_TITLE}
      OVERLEAF_ADMIN_EMAIL: ${OVERLEAF_ADMIN_EMAIL}
      OVERLEAF_EMAIL_FROM_ADDRESS: ${OVERLEAF_EMAIL_FROM_ADDRESS}
      OVERLEAF_EMAIL_SMTP_HOST: ${OVERLEAF_EMAIL_SMTP_HOST}
      OVERLEAF_EMAIL_SMTP_PORT: ${OVERLEAF_EMAIL_SMTP_PORT}
      OVERLEAF_EMAIL_SMTP_SECURE: "${OVERLEAF_EMAIL_SMTP_SECURE}"
      OVERLEAF_EMAIL_SMTP_USER: ${OVERLEAF_EMAIL_SMTP_USER}
      OVERLEAF_EMAIL_SMTP_PASS: ${OVERLEAF_EMAIL_SMTP_PASS}
      OVERLEAF_EMAIL_SMTP_TLS_REJECT_UNAUTH: "${OVERLEAF_EMAIL_SMTP_TLS_REJECT_UNAUTH}"
      OVERLEAF_EMAIL_SMTP_IGNORE_TLS: "${OVERLEAF_EMAIL_SMTP_IGNORE_TLS}"
      OVERLEAF_EMAIL_SMTP_LOGGER: "${OVERLEAF_EMAIL_SMTP_LOGGER}"
      OVERLEAF_CUSTOM_EMAIL_FOOTER: ${OVERLEAF_CUSTOM_EMAIL_FOOTER}
      ENABLE_CRON_RESOURCE_DELETION: "${ENABLE_CRON_RESOURCE_DELETION}"
      OVERLEAF_BEHIND_PROXY: "${OVERLEAF_BEHIND_PROXY}"
      OVERLEAF_SECURE_COOKIE: "${OVERLEAF_SECURE_COOKIE}"
      OVERLEAF_INVITE_TOKEN_SECRET: "${OVERLEAF_INVITE_TOKEN_SECRET}"
      GIT_INTEGRATION_ENABLED: "${GIT_INTEGRATION_ENABLED}"
      GIT_INTEGRATION_ENCRYPTION_KEY: ${GIT_INTEGRATION_ENCRYPTION_KEY}
      GITHUB_SYNC_CLIENT_ID: ${GITHUB_SYNC_CLIENT_ID}
      GITHUB_SYNC_CLIENT_SECRET: ${GITHUB_SYNC_CLIENT_SECRET}
      AI_INTEGRATION_ENABLED: "${AI_INTEGRATION_ENABLED}"
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY}
      AI_PROVIDERS_CONFIG: '${AI_PROVIDERS_CONFIG}'
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-120000}
      AI_MAX_DOCUMENT_CHARS: ${AI_MAX_DOCUMENT_CHARS:-200000}
      CODEX_LOGIN_ENABLED: "${CODEX_LOGIN_ENABLED:-false}"
      CODEX_EXECUTABLE: ${CODEX_EXECUTABLE:-codex}
      CODEX_USER_DATA_PATH: /var/lib/overleaf/codex
      CODEX_DEFAULT_MODEL: ${CODEX_DEFAULT_MODEL:-gpt-5.6-sol}
      CODEX_MODELS: '${CODEX_MODELS:-["gpt-5.6-sol","gpt-5.6-terra","gpt-5.6-luna","gpt-5.5","gpt-5.4","gpt-5.4-mini"]}'
      BACKUP_MANAGER_ENABLED: "${BACKUP_MANAGER_ENABLED}"
      BACKUP_STORAGE_PATH: /var/lib/overleaf/backups
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE}
      BACKUP_S3_ENABLED: "${BACKUP_S3_ENABLED:-false}"
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_FORCE_PATH_STYLE: "${BACKUP_S3_FORCE_PATH_STYLE:-false}"
    networks:
      - overleaf-net

  mongo:
    image: ${MONGO_IMAGE}
    container_name: ${MONGO_CONTAINER_NAME}
    restart: ${MONGO_RESTART_POLICY}
    command: "--replSet ${MONGO_REPLICA_SET}"
    volumes:
      - ${MONGO_DATA_PATH}:/data/db
      - ./bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js:ro
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    extra_hosts:
      - mongo:127.0.0.1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'db.stats().ok' | mongosh localhost:27017/test --quiet",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - overleaf-net

  redis:
    image: ${REDIS_IMAGE}
    container_name: ${REDIS_CONTAINER_NAME}
    restart: ${REDIS_RESTART_POLICY}
    volumes:
      - ${REDIS_DATA_PATH}:/data
    networks:
      - overleaf-net

  backup-manager:
    image: ${BACKUP_MANAGER_IMAGE}
    container_name: ${BACKUP_MANAGER_CONTAINER_NAME}
    restart: ${BACKUP_MANAGER_RESTART_POLICY}
    cpus: ${BACKUP_CPU_LIMIT}
    mem_limit: ${BACKUP_MEMORY_LIMIT}
    pids_limit: 256
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ${BACKUP_DATA_PATH}:/backups
      - ${SHARELATEX_DATA_PATH}:/source/sharelatex:ro
      - .:/deployment:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      TZ: ${TZ}
      BACKUP_ROOT: /backups
      OVERLEAF_MONGO_URL: ${OVERLEAF_MONGO_URL}
      REDIS_HOST: ${REDIS_HOST}
      SHARELATEX_IMAGE: ${SHARELATEX_IMAGE}
      MONGO_IMAGE: ${MONGO_IMAGE}
      REDIS_IMAGE: ${REDIS_IMAGE}
      BACKUP_WEB_UID: ${BACKUP_WEB_UID}
      BACKUP_WEB_GID: ${BACKUP_WEB_GID}
      BACKUP_REDIS_UID: ${BACKUP_REDIS_UID}
      BACKUP_REDIS_GID: ${BACKUP_REDIS_GID}
      BACKUP_MIN_FREE_GB: ${BACKUP_MIN_FREE_GB}
      BACKUP_QUIESCE_SECONDS: ${BACKUP_QUIESCE_SECONDS}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE}
      BACKUP_S3_ENABLED: "${BACKUP_S3_ENABLED:-false}"
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_FORCE_PATH_STYLE: "${BACKUP_S3_FORCE_PATH_STYLE:-false}"
      BACKUP_S3_UPLOAD_RETRIES: ${BACKUP_S3_UPLOAD_RETRIES:-3}
    networks:
      - overleaf-net

  backup-restore:
    image: ${BACKUP_MANAGER_IMAGE}
    container_name: ${BACKUP_RESTORE_CONTAINER_NAME}
    profiles:
      - restore
    volumes:
      - ${BACKUP_DATA_PATH}:/backups
      - ${SHARELATEX_DATA_PATH}:/restore/sharelatex
      - ${REDIS_DATA_PATH}:/restore/redis
      - .:/deployment
    environment:
      TZ: ${TZ}
      BACKUP_ROOT: /backups
      OVERLEAF_MONGO_URL: ${OVERLEAF_MONGO_URL}
      REDIS_HOST: ${REDIS_HOST}
      BACKUP_REDIS_UID: ${BACKUP_REDIS_UID}
      BACKUP_REDIS_GID: ${BACKUP_REDIS_GID}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE}
      BACKUP_S3_ENABLED: "${BACKUP_S3_ENABLED:-false}"
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_FORCE_PATH_STYLE: "${BACKUP_S3_FORCE_PATH_STYLE:-false}"
      BACKUP_S3_UPLOAD_RETRIES: ${BACKUP_S3_UPLOAD_RETRIES:-3}
    networks:
      - overleaf-net

  cloudflared:
    image: ${CLOUDFLARED_IMAGE}
    container_name: ${CLOUDFLARED_CONTAINER_NAME}
    restart: ${CLOUDFLARED_RESTART_POLICY}
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "run",
        "--token",
        "${CLOUDFLARE_TUNNEL_TOKEN}",
      ]
    depends_on:
      - sharelatex
    networks:
      - overleaf-net

networks:
  overleaf-net:
    name: ${OVERLEAF_NETWORK_NAME}
    driver: bridge
