services:
  sharelatex:
    image: ${SHARELATEX_IMAGE}
    container_name: ${SHARELATEX_CONTAINER_NAME}
    restart: ${SHARELATEX_RESTART_POLICY}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${OVERLEAF_HTTP_PORT}:80"
    stop_grace_period: ${SHARELATEX_STOP_GRACE_PERIOD}
    volumes:
      - ${SHARELATEX_DATA_PATH}:/var/lib/overleaf
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      TZ: ${TZ}
      DEBUG_NODE: "${DEBUG_NODE}"
      OVERLEAF_APP_NAME: ${OVERLEAF_APP_NAME}
      OVERLEAF_MONGO_URL: ${OVERLEAF_MONGO_URL}
      OVERLEAF_REDIS_HOST: ${OVERLEAF_REDIS_HOST}
      REDIS_HOST: ${REDIS_HOST}
      ENABLED_LINKED_FILE_TYPES: ${ENABLED_LINKED_FILE_TYPES}
      ENABLE_CONVERSIONS: "${ENABLE_CONVERSIONS}"
      ENABLE_PANDOC_CONVERSIONS: "${ENABLE_PANDOC_CONVERSIONS}"
      LOCAL_PANDOC_CONVERSIONS: "${LOCAL_PANDOC_CONVERSIONS}"
      EMAIL_CONFIRMATION_DISABLED: "${EMAIL_CONFIRMATION_DISABLED}"
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      OVERLEAF_SITE_URL: ${OVERLEAF_SITE_URL}
      OVERLEAF_NAV_TITLE: ${OVERLEAF_NAV_TITLE}
      OVERLEAF_ADMIN_EMAIL: ${OVERLEAF_ADMIN_EMAIL}
      OVERLEAF_EMAIL_FROM_ADDRESS: ${OVERLEAF_EMAIL_FROM_ADDRESS}
      OVERLEAF_EMAIL_SMTP_HOST: ${OVERLEAF_EMAIL_SMTP_HOST}
      OVERLEAF_EMAIL_SMTP_PORT: ${OVERLEAF_EMAIL_SMTP_PORT}
      OVERLEAF_EMAIL_SMTP_SECURE: "${OVERLEAF_EMAIL_SMTP_SECURE}"
      OVERLEAF_EMAIL_SMTP_USER: ${OVERLEAF_EMAIL_SMTP_USER}
      OVERLEAF_EMAIL_SMTP_PASS: ${OVERLEAF_EMAIL_SMTP_PASS}
      OVERLEAF_EMAIL_SMTP_TLS_REJECT_UNAUTH: "${OVERLEAF_EMAIL_SMTP_TLS_REJECT_UNAUTH}"
      OVERLEAF_EMAIL_SMTP_IGNORE_TLS: "${OVERLEAF_EMAIL_SMTP_IGNORE_TLS}"
      OVERLEAF_EMAIL_SMTP_LOGGER: "${OVERLEAF_EMAIL_SMTP_LOGGER}"
      OVERLEAF_CUSTOM_EMAIL_FOOTER: ${OVERLEAF_CUSTOM_EMAIL_FOOTER}
      ENABLE_CRON_RESOURCE_DELETION: "${ENABLE_CRON_RESOURCE_DELETION}"
      OVERLEAF_BEHIND_PROXY: "${OVERLEAF_BEHIND_PROXY}"
      OVERLEAF_SECURE_COOKIE: "${OVERLEAF_SECURE_COOKIE}"
      OVERLEAF_INVITE_TOKEN_SECRET: "${OVERLEAF_INVITE_TOKEN_SECRET}"
      GIT_INTEGRATION_ENABLED: "${GIT_INTEGRATION_ENABLED}"
      GIT_INTEGRATION_ENCRYPTION_KEY: ${GIT_INTEGRATION_ENCRYPTION_KEY}
      GITHUB_SYNC_CLIENT_ID: ${GITHUB_SYNC_CLIENT_ID}
      GITHUB_SYNC_CLIENT_SECRET: ${GITHUB_SYNC_CLIENT_SECRET}
    networks:
      - overleaf-net

  mongo:
    image: ${MONGO_IMAGE}
    container_name: ${MONGO_CONTAINER_NAME}
    restart: ${MONGO_RESTART_POLICY}
    command: "--replSet ${MONGO_REPLICA_SET}"
    volumes:
      - ${MONGO_DATA_PATH}:/data/db
      - ./bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js:ro
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    extra_hosts:
      - mongo:127.0.0.1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'db.stats().ok' | mongosh localhost:27017/test --quiet",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - overleaf-net

  redis:
    image: ${REDIS_IMAGE}
    container_name: ${REDIS_CONTAINER_NAME}
    restart: ${REDIS_RESTART_POLICY}
    volumes:
      - ${REDIS_DATA_PATH}:/data
    networks:
      - overleaf-net

  cloudflared:
    image: ${CLOUDFLARED_IMAGE}
    container_name: ${CLOUDFLARED_CONTAINER_NAME}
    restart: ${CLOUDFLARED_RESTART_POLICY}
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "run",
        "--token",
        "${CLOUDFLARE_TUNNEL_TOKEN}",
      ]
    depends_on:
      - sharelatex
    networks:
      - overleaf-net

networks:
  overleaf-net:
    name: ${OVERLEAF_NETWORK_NAME}
    driver: bridge
